# Traefik - reverse proxy for the stack
# Uses Cloudflare DNS challenge for TLS certificates
services:
  traefik:
    image: traefik:v3.7.9
    container_name: traefik
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TRAEFIK_DASHBOARD_CREDENTIALS: ${TRAEFIK_DASHBOARD_CREDENTIALS}
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme.json:/etc/traefik/acme.json
    labels:
      traefik.enable: true
      traefik.http.routers.traefik.rule: Host(`traefik.mgmt.sintaq.net`)
      traefik.http.routers.traefik.entrypoints: websecure-mgmt
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: dashboard-auth
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_CREDENTIALS}
      traefik.http.services.traefik-noop.loadbalancer.server.port: 8080

  dozzle-agent:
    image: amir20/dozzle:v10.6.13
    container_name: dozzle_agent_tfk
    restart: unless-stopped
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 7007:7007
    environment:
      DOZZLE_HOSTNAME: traefik
